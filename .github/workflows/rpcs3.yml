name: Build RPCS3

# NOTE: This workflow is trimmed down on the gh5-macos-arm64-fix branch so that
# it only builds the macOS Apple Silicon variant. Linux, Windows, FreeBSD, the
# macOS Intel variant and all deploy steps have been removed on purpose.

defaults:
  run:
    shell: bash
on:
  push:
    branches:
      - gh5-macos-arm64-fix
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_REPOSITORY_NAME: ${{ github.repository }}
  BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
  BUILD_PR_NUMBER: ${{ github.event.pull_request.number }}
  BUILD_SOURCEVERSION: ${{ github.sha }}
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/

jobs:
  Mac_Build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'gh5-macos-arm64-fix')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runs-on: macos-26
    name: RPCS3 Mac ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    env:
      CCACHE_DIR: /tmp/ccache_dir
      QT_VER: '6.12.0'
      QT_VER_MAIN: '6'
      LLVM_COMPILER_VER: '22'
      RELEASE_MESSAGE: ../GitHubReleaseMessage.txt
      RUN_UNIT_TESTS: 'OFF'
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup MacPorts
        uses: melusina-org/setup-macports@v1
        with:
            cache: 'disable'

      - name: Restore Build Ccache
        uses: actions/cache/restore@main
        id: restore-build-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ matrix.name }}-${{github.run_id}}
          restore-keys: ${{ runner.os }}-ccache-${{ matrix.name }}-

      - name: Restore Qt Cache
        uses: actions/cache/restore@main
        id: restore-qt-cache
        with:
          path: /tmp/Qt
          key: ${{ runner.os }}-qt-${{ matrix.name }}-${{ env.QT_VER }}
          restore-keys: ${{ runner.os }}-qt-${{ matrix.name }}-${{ env.QT_VER }}

      - name: Build
        run: .ci/build-mac.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: RPCS3 for Mac (${{ matrix.name }})
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          compression-level: 0
          if-no-files-found: error

      # Save caches even if the build fails, so that a retry is faster
      - name: Save Build Ccache
        if: always() && steps.restore-build-ccache.outputs.cache-primary-key != ''
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-ccache.outputs.cache-primary-key }}

      - name: Save Qt Cache
        if: always() && steps.restore-qt-cache.outputs.cache-hit != 'true' && steps.restore-qt-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@main
        with:
          path: /tmp/Qt
          key: ${{ steps.restore-qt-cache.outputs.cache-primary-key }}
